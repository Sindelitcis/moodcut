<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moodcut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #0a0a0a;
      --surface:      #111111;
      --surface2:     #191919;
      --border:       #252525;
      --border-light: #333333;
      --text:         #e8e8e8;
      --text-muted:   #606060;
      --accent:       #FF4500;
      --accent-dim:   rgba(255, 69, 0, 0.12);
      --accent-glow:  rgba(255, 69, 0, 0.25);
      --green:        #4ade80;
      --red:          #f87171;
      --yellow:       #fbbf24;
      --blue:         #60a5fa;
      --term-bg:      #0c0c0c;
      --term-text:    #c8c8c8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 52px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 3px;
      color: #fff;
      text-transform: uppercase;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      transition: all 0.3s;
    }

    .status-badge.running {
      color: var(--accent);
      border-color: var(--accent-glow);
      background: var(--accent-dim);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
    }

    .status-badge.running .status-dot {
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Main layout ─────────────────────────────────────────── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Controls panel ──────────────────────────────────────── */
    .controls {
      width: 300px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: var(--surface);
    }

    .controls::-webkit-scrollbar { width: 4px; }
    .controls::-webkit-scrollbar-track { background: transparent; }
    .controls::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* Field */
    .field { display: flex; flex-direction: column; gap: 6px; }

    label.field-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input[type="text"], input[type="url"], select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }

    input[type="text"]:focus, input[type="url"]:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    input::placeholder { color: var(--text-muted); }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper::after {
      content: '▾';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 12px;
    }

    /* Checkboxes */
    .checks { display: flex; flex-direction: column; gap: 6px; }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }

    .check-item:hover { border-color: var(--border-light); background: #1e1e1e; }

    .check-item input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .check-item span {
      font-size: 13px;
      color: var(--text);
      flex: 1;
    }

    .check-item small {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #e03d00;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #222;
      border-color: var(--border-light);
      color: var(--text);
    }

    .btn-secondary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-danger {
      background: rgba(248, 113, 113, 0.1);
      color: var(--red);
      border: 1px solid rgba(248, 113, 113, 0.25);
    }

    .btn-danger:hover:not(:disabled) {
      background: rgba(248, 113, 113, 0.2);
    }

    .btn-danger:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
    }

    /* ── Terminal ────────────────────────────────────────────── */
    .terminal-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 40px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .terminal-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .term-controls { display: flex; gap: 8px; }

    .btn-small {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-small:hover { border-color: var(--border-light); color: var(--text); background: var(--surface2); }

    .terminal {
      flex: 1;
      background: var(--term-bg);
      font-family: 'JetBrains Mono', 'Consolas', monospace;
      font-size: 12.5px;
      line-height: 1.65;
      padding: 16px 20px;
      overflow-y: auto;
      overflow-x: hidden;
      color: var(--term-text);
      word-break: break-all;
    }

    .terminal::-webkit-scrollbar { width: 5px; }
    .terminal::-webkit-scrollbar-track { background: transparent; }
    .terminal::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }

    .terminal a {
      color: var(--blue);
      text-decoration: underline;
      text-underline-offset: 2px;
      word-break: break-all;
    }
    .terminal a:hover { color: #93c5fd; }

    .term-placeholder {
      color: var(--text-muted);
      font-style: italic;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      margin-top: 12px;
    }

    /* Log line colors */
    .log-line { display: block; white-space: pre-wrap; }
    .log-cmd   { color: #888; }
    .log-ok    { color: var(--green); }
    .log-error { color: var(--red); }
    .log-warn  { color: var(--yellow); }
    .log-info  { color: var(--blue); }
    .log-done  { color: var(--green); font-weight: 500; }
    .log-sep   { color: #444; }
    .log-lib   { color: #3a3a3a; font-size: 11px; }   /* dim library output */

    /* Stage progress cards */
    .stage-card {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 6px;
      padding: 9px 14px;
      background: #161616;
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #ccc;
      letter-spacing: 0.3px;
    }

    .stage-card.done {
      border-left-color: var(--green);
      color: var(--green);
      background: #0d1a0d;
    }

    .stage-card .stage-icon { font-size: 15px; }

    /* ── Thumbnails section ──────────────────────────────────── */
    .thumbs-section {
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      max-height: 240px;
      overflow: hidden;
      display: none;
      flex-direction: column;
    }

    .thumbs-section.visible { display: flex; }

    .thumbs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 40px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .thumbs-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .thumbs-count {
      background: var(--accent-dim);
      color: var(--accent);
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--accent-glow);
    }

    .thumbs-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 12px 20px;
      flex: 1;
    }

    .thumbs-scroll::-webkit-scrollbar { height: 4px; }
    .thumbs-scroll::-webkit-scrollbar-track { background: transparent; }
    .thumbs-scroll::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

    .thumbs-grid {
      display: flex;
      gap: 10px;
      height: 100%;
    }

    .thumb-card {
      flex-shrink: 0;
      width: 192px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface2);
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .thumb-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
      transform: translateY(-2px);
    }

    .thumb-card img {
      width: 100%;
      height: 108px;
      object-fit: cover;
      display: block;
    }

    .thumb-caption {
      padding: 5px 8px;
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 20px;
    }

    .thumb-card:hover .thumb-overlay { opacity: 1; }

    /* ── Tabs ───────────────────────────────────────────────── */
    .tab-bar {
      display: flex;
      gap: 4px;
      padding: 0 0 16px;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.3px;
    }

    .tab-btn:hover { border-color: var(--border-light); color: var(--text); }
    .tab-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent-glow);
      color: var(--accent);
    }

    .tab-panel { display: none; flex-direction: column; gap: 20px; }
    .tab-panel.active { display: flex; }

    /* ── Password modal ─────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 24px;
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .modal-box h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .modal-box input[type="password"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
    }

    .modal-box input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 8px 16px;
      border-radius: 7px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .modal-actions button:hover { border-color: var(--border-light); color: var(--text); }

    .modal-actions .btn-confirm {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .modal-actions .btn-confirm:hover { background: #e03d00; }

    /* ── Channel status cards ───────────────────────────────── */
    .ch-status-list { display: flex; flex-direction: column; gap: 8px; }

    .ch-status-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .ch-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .ch-status-dot.ok         { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .ch-status-dot.sem_token  { background: var(--red); }
    .ch-status-dot.invalido   { background: var(--red); }
    .ch-status-dot.sem_refresh { background: var(--yellow); }

    .ch-status-info { flex: 1; }
    .ch-status-name { font-size: 13px; font-weight: 500; }
    .ch-status-label { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

    .ch-status-lock {
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.5;
    }

    /* ── Responsive ──────────────────────────────────────────── */
    @media (max-width: 700px) {
      .controls { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 45vh; }
      .layout { flex-direction: column; }
    }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────── -->
<header>
  <div class="logo">
    <div class="logo-icon">▶</div>
    Moodcut
  </div>
  <div class="header-right">
    <div class="status-badge" id="statusBadge">
      <div class="status-dot"></div>
      <span id="statusText">Idle</span>
    </div>
  </div>
</header>

<!-- ── Main ────────────────────────────────────────────── -->
<div class="layout">

  <!-- Controls -->
  <aside class="controls">

    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="pipeline">▶ Pipeline</button>
      <button class="tab-btn"        data-tab="status">● Status</button>
    </div>

    <!-- ── Tab: Pipeline ── -->
    <div class="tab-panel active" id="tab-pipeline">

      <!-- URL -->
      <div class="field">
        <label class="field-label">URL do VOD</label>
        <input
          type="url"
          id="urlInput"
          placeholder="https://www.twitch.tv/videos/…"
          autocomplete="off"
          spellcheck="false"
        >
      </div>

      <!-- Channel -->
      <div class="field">
        <label class="field-label">Canal</label>
        <div class="select-wrapper">
          <select id="channelSelect">
            <option value="1">Canal 1</option>
          </select>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Flags -->
      <div class="field">
        <label class="field-label">Opções</label>
        <div class="checks">
          <label class="check-item">
            <input type="checkbox" id="skipUpload">
            <span>Skip Upload</span>
            <small>--skip-upload</small>
          </label>
          <label class="check-item">
            <input type="checkbox" id="skipThumb">
            <span>Skip Thumbnail</span>
            <small>--skip-thumb</small>
          </label>
          <label class="check-item">
            <input type="checkbox" id="onlyThumb">
            <span>Só Thumbnails</span>
            <small>--only-thumb</small>
          </label>
          <label class="check-item">
            <input type="checkbox" id="onlyUpload">
            <span>Só Upload</span>
            <small>--only-upload</small>
          </label>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Actions -->
      <div class="btn-group">
        <button class="btn btn-primary" id="runBtn" disabled>
          ▶&nbsp; Rodar Pipeline
        </button>
        <button class="btn btn-danger" id="stopBtn" disabled>
          ■&nbsp; Parar
        </button>
        <button class="btn btn-secondary" id="thumbsBtn" type="button">
          🖼&nbsp; Ver Thumbnails
        </button>
      </div>

    </div><!-- /tab-pipeline -->

    <!-- ── Tab: Status ── -->
    <div class="tab-panel" id="tab-status">

      <div class="field">
        <label class="field-label">Canais</label>
        <div class="ch-status-list" id="chStatusList">
          <span style="color:var(--text-muted);font-size:12px">Carregando…</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-secondary" id="checkStatusBtn">
          🔍&nbsp; Verificar no Terminal
        </button>
      </div>

      <div class="divider"></div>

      <small style="color:var(--text-muted);font-size:10px;line-height:1.6">
        Para autorizar um canal, rode no terminal do PC:<br>
        <code style="color:#888">py -3.12 main.py --auth --channel=N</code><br><br>
        Para adicionar senha a um canal, edite <code style="color:#888">channels.yaml</code>
        e adicione <code style="color:#888">senha: "suasenha"</code>.
      </small>

    </div><!-- /tab-status -->

  </aside>

  <!-- Terminal column -->
  <div class="terminal-col">
    <div class="terminal-header">
      <div class="terminal-title">
        Terminal
        <span id="lineCount" style="color:#444;font-size:10px;font-family:'JetBrains Mono',monospace"></span>
      </div>
      <div class="term-controls">
        <button class="btn-small" id="clearBtn">Limpar</button>
        <button class="btn-small" id="scrollBtn">↓ Fim</button>
      </div>
    </div>

    <div class="terminal" id="terminal">
      <span class="term-placeholder">Pipeline inativo. Configure uma URL e clique em Rodar.</span>
    </div>
  </div>

</div>

<!-- ── Password modal ──────────────────────────────────── -->
<div class="modal-overlay" id="pwModal" style="display:none">
  <div class="modal-box">
    <h3 id="pwTitle">Senha do Canal</h3>
    <input type="password" id="pwInput" placeholder="Digite a senha…" autocomplete="off">
    <div class="modal-actions">
      <button id="pwCancel">Cancelar</button>
      <button class="btn-confirm" id="pwConfirm">Confirmar</button>
    </div>
  </div>
</div>

<!-- ── Thumbnails ───────────────────────────────────────── -->
<div class="thumbs-section" id="thumbsSection">
  <div class="thumbs-header">
    <div class="thumbs-title">
      Thumbnails Geradas
      <span class="thumbs-count" id="thumbsCount">0</span>
    </div>
    <button class="btn-small" id="refreshThumbsBtn">Atualizar</button>
  </div>
  <div class="thumbs-scroll">
    <div class="thumbs-grid" id="thumbsGrid"></div>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────
  let isRunning      = false;
  let streamCtrl     = null;   // AbortController for the SSE fetch
  let _currentCh     = 0;      // channel currently running (for stop password)

  // ── DOM refs ───────────────────────────────────────────────────────────
  const urlInput      = document.getElementById('urlInput');
  const channelSelect = document.getElementById('channelSelect');
  const skipUpload    = document.getElementById('skipUpload');
  const skipThumb     = document.getElementById('skipThumb');
  const onlyThumb     = document.getElementById('onlyThumb');
  const onlyUpload    = document.getElementById('onlyUpload');
  const runBtn        = document.getElementById('runBtn');
  const stopBtn       = document.getElementById('stopBtn');
  const thumbsBtn     = document.getElementById('thumbsBtn');
  const terminal      = document.getElementById('terminal');
  const statusBadge   = document.getElementById('statusBadge');
  const statusText    = document.getElementById('statusText');
  const lineCount     = document.getElementById('lineCount');
  const thumbsSection = document.getElementById('thumbsSection');
  const thumbsGrid    = document.getElementById('thumbsGrid');
  const thumbsCount   = document.getElementById('thumbsCount');
  const pwModal       = document.getElementById('pwModal');
  const pwTitle       = document.getElementById('pwTitle');
  const pwInput       = document.getElementById('pwInput');
  const pwConfirm     = document.getElementById('pwConfirm');
  const pwCancel      = document.getElementById('pwCancel');
  const chStatusList  = document.getElementById('chStatusList');

  // ── Password modal (Promise-based) ────────────────────────────────────
  function askPassword(title) {
    return new Promise((resolve, reject) => {
      pwTitle.textContent = title;
      pwInput.value = '';
      pwModal.style.display = 'flex';
      setTimeout(() => pwInput.focus(), 50);

      const confirm = () => { cleanup(); pwModal.style.display = 'none'; resolve(pwInput.value); };
      const cancel  = () => { cleanup(); pwModal.style.display = 'none'; reject(); };
      const onKey   = e => { if (e.key === 'Enter') confirm(); if (e.key === 'Escape') cancel(); };

      function cleanup() {
        pwConfirm.removeEventListener('click', confirm);
        pwCancel.removeEventListener('click', cancel);
        pwInput.removeEventListener('keydown', onKey);
      }

      pwConfirm.addEventListener('click', confirm);
      pwCancel.addEventListener('click', cancel);
      pwInput.addEventListener('keydown', onKey);
    });
  }

  // ── Tabs ───────────────────────────────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'status') loadChannelStatus();
    });
  });

  // ── Init ───────────────────────────────────────────────────────────────
  async function init() {
    await loadChannels();
    checkStatus();
    loadThumbs();
    urlInput.addEventListener('input', updateRunBtn);
    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') runBtn.click(); });
    onlyThumb.addEventListener('change',  () => { if (onlyThumb.checked)  onlyUpload.checked = false; });
    onlyUpload.addEventListener('change', () => { if (onlyUpload.checked) onlyThumb.checked  = false; });
  }

  function updateRunBtn() {
    runBtn.disabled = isRunning || !urlInput.value.trim();
  }

  // ── Load channels ──────────────────────────────────────────────────────
  async function loadChannels() {
    try {
      const res = await fetch('/api/channels');
      const data = await res.json();
      channelSelect.innerHTML = '';
      for (const [id, info] of Object.entries(data)) {
        const opt = document.createElement('option');
        opt.value = id;
        opt.textContent = `${info.nome} (Canal ${id})`;
        channelSelect.appendChild(opt);
      }
    } catch (e) { console.warn('Erro ao carregar canais:', e); }
  }

  // ── Channel status tab ─────────────────────────────────────────────────
  async function loadChannelStatus() {
    chStatusList.innerHTML = '<span style="color:var(--text-muted);font-size:12px">Verificando…</span>';
    try {
      const res  = await fetch('/api/channel-status');
      const list = await res.json();
      chStatusList.innerHTML = '';
      const labels = { ok: 'Autorizado ✓', sem_token: 'Sem token — rode --auth', invalido: 'Token inválido', sem_refresh: 'Token sem refresh' };
      for (const ch of list) {
        const card = document.createElement('div');
        card.className = 'ch-status-card';
        card.innerHTML = `
          <div class="ch-status-dot ${ch.status}"></div>
          <div class="ch-status-info">
            <div class="ch-status-name">Canal ${ch.id} — ${ch.nome}</div>
            <div class="ch-status-label">${labels[ch.status] || ch.status}</div>
          </div>
          ${ch.has_password ? '<span class="ch-status-lock" title="Senha configurada">🔒</span>' : ''}
        `;
        chStatusList.appendChild(card);
      }
    } catch (e) {
      chStatusList.innerHTML = '<span style="color:var(--red);font-size:12px">Erro ao carregar status.</span>';
    }
  }

  // Verify in terminal button
  document.getElementById('checkStatusBtn').addEventListener('click', async () => {
    terminal.innerHTML = '';
    logLineTotal = 0;
    appendLog('$ Verificando status dos canais…');
    appendLog('');
    try {
      const res  = await fetch('/api/channel-status');
      const list = await res.json();
      const labels = { ok: '✓ Autorizado', sem_token: '✗ Sem token (rode --auth)', invalido: '✗ Token inválido', sem_refresh: '⚠ Token sem refresh' };
      for (const ch of list) {
        appendLog(`  [Canal ${ch.id}] ${ch.nome}`);
        appendLog(`    ${labels[ch.status] || ch.status}${ch.has_password ? '  🔒' : ''}`);
        appendLog('');
      }
      appendLog('[OK] Verificação concluída.');
    } catch (e) {
      appendLog('[ERRO] Não foi possível verificar: ' + e.message);
    }
  });

  // ── Resume stream if already running ───────────────────────────────────
  async function checkStatus() {
    try {
      const res  = await fetch('/api/status');
      const data = await res.json();
      if (data.running) {
        _currentCh = data.channel || 0;
        setRunning(true);
        const logRes  = await fetch('/api/logs');
        const logData = await logRes.json();
        terminal.innerHTML = '';
        logData.lines.forEach(appendLog);
        startStream(logData.total);
      }
    } catch (e) { /* server not ready yet */ }
  }

  // ── Run pipeline ────────────────────────────────────────────────────────
  runBtn.addEventListener('click', async () => {
    const url = urlInput.value.trim();
    if (!url || isRunning) return;

    const ch = parseInt(channelSelect.value, 10);
    let password = '';
    try {
      // Ask for password — modal resolves with the typed value (may be empty)
      password = await askPassword(`Senha do Canal ${ch}`);
    } catch {
      return; // user cancelled
    }

    const body = {
      url,
      channel:     ch,
      skip_upload: skipUpload.checked,
      skip_thumb:  skipThumb.checked,
      only_thumb:  onlyThumb.checked,
      only_upload: onlyUpload.checked,
      password,
    };

    try {
      const res  = await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }

      _currentCh = ch;
      terminal.innerHTML = '';
      logLineTotal = 0;
      _seenStages.clear();
      setRunning(true);
      startStream(0);
    } catch (e) {
      alert('Erro ao iniciar pipeline: ' + e.message);
    }
  });

  // ── Stop pipeline ───────────────────────────────────────────────────────
  stopBtn.addEventListener('click', async () => {
    let password = '';
    try {
      password = await askPassword(`Senha do Canal ${_currentCh || '?'} para parar`);
    } catch {
      return; // cancelled
    }
    try {
      const res  = await fetch('/api/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ channel: _currentCh, password }) });
      const data = await res.json();
      if (data.error) alert(data.error);
    } catch (e) { /* ignore */ }
  });

  // ── Clear terminal ──────────────────────────────────────────────────────
  document.getElementById('clearBtn').addEventListener('click', () => {
    terminal.innerHTML = '';
    lineCount.textContent = '';
  });

  // ── Scroll to bottom ────────────────────────────────────────────────────
  document.getElementById('scrollBtn').addEventListener('click', () => {
    terminal.scrollTop = terminal.scrollHeight;
  });

  // ── Toggle thumbnails panel ─────────────────────────────────────────────
  thumbsBtn.addEventListener('click', () => {
    const visible = thumbsSection.classList.toggle('visible');
    if (visible) loadThumbs();
  });

  document.getElementById('refreshThumbsBtn').addEventListener('click', loadThumbs);

  // ── SSE streaming ───────────────────────────────────────────────────────
  async function startStream(fromLine) {
    if (streamCtrl) streamCtrl.abort();
    streamCtrl = new AbortController();

    try {
      const resp = await fetch(`/api/stream?from_line=${fromLine}`, { signal: streamCtrl.signal });
      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let   buffer  = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const raw of lines) {
          if (!raw.startsWith('data: ')) continue;
          const text = raw.slice(6);
          if (text === '__DONE__') { onPipelineComplete(); return; }
          if (text === '') continue;
          appendLog(text);
        }
      }
    } catch (e) {
      if (e.name !== 'AbortError') {
        appendLog('[ERRO] Conexão com o servidor perdida.');
        setRunning(false);
      }
    }
  }

  function onPipelineComplete() {
    setRunning(false);
    loadThumbs();
    thumbsSection.classList.add('visible');
  }

  // ── State helpers ───────────────────────────────────────────────────────
  function setRunning(running) {
    isRunning = running;
    statusBadge.classList.toggle('running', running);
    statusText.textContent = running ? 'Rodando' : 'Idle';
    runBtn.disabled  = running || !urlInput.value.trim();
    stopBtn.disabled = !running;
  }

  // ── Stage cards ─────────────────────────────────────────────────────────
  const STAGE_TRIGGERS = [
    { re: /\[download\]/,                                     icon: '🔽', label: 'Baixando VOD…',                             key: 'dl',    done: false },
    { re: /\[OK\] Download conclu/,                           icon: '✅', label: 'Download concluído',                        key: 'dl-ok', done: true  },
    { re: /Performing voice activity|whisperx\.vads|whisperx\.asr.*INFO/, icon: '🎙️', label: 'Transcrevendo — pode demorar vários minutos…', key: 'tr', done: false },
    { re: /\[OK\].*[Tt]ranscri/,                              icon: '✅', label: 'Transcrição concluída',                     key: 'tr-ok', done: true  },
    { re: /Passagem 1.*Mapeando/,                             icon: '🔍', label: 'Analisando tópicos (Passagem 1)…',          key: 'an1',   done: false },
    { re: /Passagem 2.*Enriquecendo/,                         icon: '✍️', label: 'Enriquecendo metadados (Passagem 2)…',      key: 'an2',   done: false },
    { re: /\[OK\].*[Aa]nális/,                                icon: '✅', label: 'Análise concluída',                         key: 'an-ok', done: true  },
    { re: /Gerando clipe|Cortando|ffmpeg.*clipe/i,            icon: '✂️', label: 'Cortando clipes…',                          key: 'clip',  done: false },
    { re: /[Tt]humbnail|thumbnailer/,                         icon: '🖼️', label: 'Gerando thumbnails…',                       key: 'thumb', done: false },
    { re: /\[YouTube\]|Enviando.*YouTube/i,                   icon: '☁️', label: 'Fazendo upload…',                           key: 'up',    done: false },
  ];

  const _seenStages = new Set();

  function checkStage(text) {
    for (const s of STAGE_TRIGGERS) {
      if (!_seenStages.has(s.key) && s.re.test(text)) {
        _seenStages.add(s.key);
        const card = document.createElement('div');
        card.className = 'stage-card' + (s.done ? ' done' : '');
        card.innerHTML = `<span class="stage-icon">${s.icon}</span><span>${s.label}</span>`;
        terminal.appendChild(card);
        return true;
      }
    }
    return false;
  }

  // ── Terminal rendering ──────────────────────────────────────────────────
  let logLineTotal = 0;

  function appendLog(text) {
    const placeholder = terminal.querySelector('.term-placeholder');
    if (placeholder) placeholder.remove();

    const atBottom =
      terminal.scrollHeight - terminal.clientHeight <= terminal.scrollTop + 60;

    // Inject stage card before the triggering line (once per stage key)
    checkStage(text);

    const span = document.createElement('span');
    span.className = 'log-line ' + classifyLine(text);
    renderLine(span, text);
    terminal.appendChild(span);

    logLineTotal++;
    lineCount.textContent = `${logLineTotal} linhas`;

    if (atBottom) terminal.scrollTop = terminal.scrollHeight;
  }

  // Render text into a span, turning any https:// URLs into clickable links.
  function renderLine(span, text) {
    const urlRe = /(https?:\/\/\S+)/g;
    let last = 0, m;
    urlRe.lastIndex = 0;
    while ((m = urlRe.exec(text)) !== null) {
      if (m.index > last)
        span.appendChild(document.createTextNode(text.slice(last, m.index)));
      const a = document.createElement('a');
      a.href = m[1];
      a.textContent = m[1];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      span.appendChild(a);
      last = m.index + m[1].length;
    }
    span.appendChild(document.createTextNode(text.slice(last) + '\n'));
  }

  function classifyLine(text) {
    if (text.startsWith('$'))                                      return 'log-cmd';
    if (text.includes('[ERRO]') || text.includes('Traceback') ||
        text.startsWith('✗'))                                      return 'log-error';
    if (text.includes('[WARN]') || text.includes('[AVISO]'))       return 'log-warn';
    if (text.includes('[OK]') || text.startsWith('✓'))             return 'log-ok';
    if (text.includes('[*]') || text.startsWith('  ->'))           return 'log-info';
    if (text.startsWith('---') || text.startsWith('==='))          return 'log-sep';
    // Library log format: "2026-06-15 06:12:08 - module.name - INFO - ..."
    if (/\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} - [\w.]+ - (INFO|WARNING|DEBUG)/.test(text)) return 'log-lib';
    return '';
  }

  // ── Thumbnails ──────────────────────────────────────────────────────────
  async function loadThumbs() {
    try {
      const res   = await fetch('/api/thumbs');
      const files = await res.json();

      thumbsCount.textContent = files.length;

      if (files.length === 0) {
        thumbsGrid.innerHTML =
          '<span style="color:var(--text-muted);font-size:13px;align-self:center">Nenhuma thumbnail gerada ainda.</span>';
        return;
      }

      thumbsGrid.innerHTML = '';
      for (const name of files) {
        const card = document.createElement('div');
        card.className = 'thumb-card';
        card.title = name;

        const img = document.createElement('img');
        img.src     = `/thumbs/${encodeURIComponent(name)}`;
        img.loading = 'lazy';
        img.alt     = name;

        const caption = document.createElement('div');
        caption.className = 'thumb-caption';
        caption.textContent = formatThumbName(name);

        const overlay = document.createElement('div');
        overlay.className   = 'thumb-overlay';
        overlay.textContent = '🔍';

        card.appendChild(img);
        card.appendChild(caption);
        card.appendChild(overlay);

        card.addEventListener('click', () => {
          window.open(`/thumbs/${encodeURIComponent(name)}`, '_blank');
        });

        thumbsGrid.appendChild(card);
      }
    } catch (e) {
      console.warn('Erro ao carregar thumbnails:', e);
    }
  }

  function formatThumbName(filename) {
    // "01_engracado_titulo_do_clip.jpg" → "01 — Titulo do clip"
    const name  = filename.replace('.jpg', '');
    const parts = name.split('_');
    if (parts.length < 2) return name;
    const num   = parts[0];
    const title = parts.slice(2).join(' ');
    return `${num} — ${title.charAt(0).toUpperCase()}${title.slice(1)}`;
  }

  // ── Boot ────────────────────────────────────────────────────────────────
  init();
</script>
</body>
</html>
